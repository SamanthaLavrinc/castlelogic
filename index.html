<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- No static <title>/<meta description> here on purpose: react-helmet-async
         (src/components/SEO.jsx) sets these per-route, but never removes tags it
         didn't render itself. A static fallback here would sit alongside Helmet's
         tag rather than get replaced by it — and since only the first <title> in
         a document is spec-valid, a non-JS crawler reading the prerendered HTML
         would see the generic fallback instead of the real per-route title. -->

    <link rel="preload" as="image" href="/assets/side-logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            nunito: ['Nunito', 'sans-serif'],
            fredoka: ['Fredoka', 'sans-serif']
          }
        }
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Castle Logic LLC",
      "url": "https://castlelogic.dev",
      "logo": "https://castlelogic.dev/icon.png",
      "description": "Design and development studio specializing in modern, responsive UI/UX solutions.",
      "email": "contact@castlelogic.dev",
      "foundingDate": "2024",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Pittsburgh",
        "addressRegion": "PA",
        "addressCountry": "US"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Samantha Lavrinc",
      "url": "https://castlelogic.dev",
      "jobTitle": "Founder & Lead Software Engineer",
      "worksFor": {
        "@type": "Organization",
        "name": "Castle Logic LLC"
      },
      "email": "contact@castlelogic.dev",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Pittsburgh",
        "addressRegion": "PA",
        "addressCountry": "US"
      },
      "knowsAbout": ["React", "Java", "SQL", "TypeScript", "UX/UI Design", "NLP", "Full-Stack Development"]
    }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
